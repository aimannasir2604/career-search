<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Search - Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-card auth-card-wide">
            <div class="auth-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                </svg>
            </div>
            <h2 class="auth-title">Create Student Account</h2>
            <p class="auth-subtitle">Join us and discover your future</p>

            <form method="post" action="{{ url_for('signup') }}" class="auth-form signup-grid">
                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <div class="input-with-icon">
                        <input
                            type="text"
                            id="full_name"
                            name="full_name"
                            placeholder="Enter full name"
                            required
                        />
                    </div>
                </div>

                <div class="form-group">
                    <label for="father_name">Father's Name</label>
                    <div class="input-with-icon">
                        <input
                            type="text"
                            id="father_name"
                            name="father_name"
                            placeholder="Enter father's name"
                            required
                        />
                    </div>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <div class="input-with-icon">
                        <input
                            type="number"
                            id="age"
                            name="age"
                            placeholder="Enter age"
                            min="5"
                            required
                        />
                    </div>
                </div>

                <div class="form-group">
                    <label for="class_name">Class</label>
                    <div class="input-with-icon">
                        <input
                            type="text"
                            id="class_name"
                            name="class_name"
                            placeholder="e.g., 10th Grade"
                            required
                        />
                    </div>
                </div>

                <div class="form-group">
                    <label for="student_id">Student ID</label>
                    <div class="input-with-icon">
                        <input
                            type="text"
                            id="student_id"
                            name="student_id"
                            placeholder="Create student ID"
                            required
                        />
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create password"
                            required
                        />
                    </div>
                </div>

                <div class="signup-actions">
                    <button type="submit" class="btn primary-btn full-width">
                        Register
                    </button>
                    <button
                        type="button"
                        class="btn secondary-btn full-width"
                        onclick="window.location.href='{{ url_for('login') }}'"
                    >
                        Back to Login
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
